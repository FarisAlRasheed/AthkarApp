<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>تطبيق الأذكار</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="theme-morning">

  <!-- Morning sky background (shown for morning theme) -->
  <div class="morning-bg" id="morningBg"></div>

  <!-- Night sky background (shown for evening theme) -->
  <div class="night-bg" id="nightBg"></div>

  <div class="page">

    <!-- Top bar: athkar title + dropdown -->
    <header class="top-bar">
      <div class="controls-backdrop"></div>
      <button class="reset-all" id="resetAllBtn" aria-label="إعادة تعيين الكل" title="إعادة تعيين الكل">↺</button>
      <div class="title-dropdown" id="titleDropdown">
        <h1 class="athkar-title" id="athkarTitle">أذكار الصباح</h1>
        <svg class="dropdown-arrow" id="dropdownArrow" viewBox="0 0 24 24" width="18" height="18">
          <polyline points="6 9 12 15 18 9" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="dropdown-menu" id="dropdownMenu"></div>
      </div>
    </header>

    <!-- Directional hint arrows -->
    <div class="hint-arrow hint-up" id="hintUp">
      <svg viewBox="0 0 24 24" width="22" height="22"><polyline points="18 15 12 9 6 15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="hint-arrow hint-down" id="hintDown">
      <svg viewBox="0 0 24 24" width="22" height="22"><polyline points="6 9 12 15 18 9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="hint-arrow hint-left" id="hintLeft">
      <svg viewBox="0 0 24 24" width="22" height="22"><polyline points="15 18 9 12 15 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="hint-arrow hint-right" id="hintRight">
      <svg viewBox="0 0 24 24" width="22" height="22"><polyline points="9 18 15 12 9 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>

    <!-- Card area -->
    <main class="canvas">
      <div class="card-frame">
        <div id="card" class="card-outer" aria-live="polite"></div>
      </div>
    </main>

  </div>

  <script src="script.js"></script>
</body>
</html>
