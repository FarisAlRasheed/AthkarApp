<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="sky" cx="50%" cy="120%" r="120%">
      <stop offset="0%" stop-color="#1a1a3e"/>
      <stop offset="40%" stop-color="#0d0d2b"/>
      <stop offset="100%" stop-color="#050510"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="starGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <!-- Nebula hints -->
  <ellipse cx="400" cy="300" rx="300" ry="150" fill="#1e1040" opacity="0.3"/>
  <ellipse cx="1500" cy="700" rx="250" ry="120" fill="#0d1a3a" opacity="0.3"/>
  <ellipse cx="960" cy="500" rx="400" ry="200" fill="#12102e" opacity="0.2"/>
  <!-- Stars - tiny -->
  <g fill="#fff" opacity="0.6">
    <circle cx="100" cy="50" r="0.8"/><circle cx="250" cy="120" r="0.6"/><circle cx="380" cy="80" r="0.9"/>
    <circle cx="520" cy="200" r="0.7"/><circle cx="670" cy="60" r="0.8"/><circle cx="810" cy="150" r="0.5"/>
    <circle cx="940" cy="30" r="0.9"/><circle cx="1080" cy="180" r="0.6"/><circle cx="1200" cy="90" r="0.8"/>
    <circle cx="1350" cy="210" r="0.7"/><circle cx="1500" cy="50" r="0.9"/><circle cx="1650" cy="170" r="0.6"/>
    <circle cx="1800" cy="100" r="0.8"/><circle cx="50" cy="300" r="0.7"/><circle cx="200" cy="400" r="0.6"/>
    <circle cx="330" cy="500" r="0.9"/><circle cx="480" cy="350" r="0.5"/><circle cx="600" cy="450" r="0.8"/>
    <circle cx="750" cy="380" r="0.7"/><circle cx="900" cy="520" r="0.6"/><circle cx="1050" cy="400" r="0.9"/>
    <circle cx="1180" cy="550" r="0.5"/><circle cx="1320" cy="420" r="0.8"/><circle cx="1470" cy="500" r="0.7"/>
    <circle cx="1600" cy="360" r="0.6"/><circle cx="1750" cy="480" r="0.9"/><circle cx="1880" cy="350" r="0.5"/>
    <circle cx="120" cy="600" r="0.8"/><circle cx="280" cy="700" r="0.7"/><circle cx="430" cy="650" r="0.6"/>
    <circle cx="580" cy="750" r="0.9"/><circle cx="720" cy="620" r="0.5"/><circle cx="870" cy="780" r="0.8"/>
    <circle cx="1020" cy="680" r="0.7"/><circle cx="1160" cy="800" r="0.6"/><circle cx="1300" cy="720" r="0.9"/>
    <circle cx="1450" cy="830" r="0.5"/><circle cx="1580" cy="690" r="0.8"/><circle cx="1730" cy="760" r="0.7"/>
    <circle cx="1860" cy="640" r="0.6"/><circle cx="80" cy="880" r="0.9"/><circle cx="220" cy="950" r="0.5"/>
    <circle cx="370" cy="900" r="0.8"/><circle cx="510" cy="1000" r="0.7"/><circle cx="660" cy="920" r="0.6"/>
    <circle cx="800" cy="1050" r="0.9"/><circle cx="950" cy="870" r="0.5"/><circle cx="1100" cy="980" r="0.8"/>
    <circle cx="1240" cy="910" r="0.7"/><circle cx="1390" cy="1020" r="0.6"/><circle cx="1540" cy="950" r="0.9"/>
    <circle cx="1680" cy="880" r="0.5"/><circle cx="1820" cy="1000" r="0.8"/>
  </g>
  <!-- Stars - medium -->
  <g fill="#fff" opacity="0.8" filter="url(#starGlow)">
    <circle cx="180" cy="160" r="1.2"/><circle cx="460" cy="280" r="1.4"/><circle cx="740" cy="110" r="1.1"/>
    <circle cx="1010" cy="320" r="1.3"/><circle cx="1290" cy="140" r="1.2"/><circle cx="1560" cy="260" r="1.4"/>
    <circle cx="1840" cy="200" r="1.1"/><circle cx="310" cy="580" r="1.3"/><circle cx="590" cy="470" r="1.2"/>
    <circle cx="860" cy="640" r="1.4"/><circle cx="1140" cy="510" r="1.1"/><circle cx="1410" cy="670" r="1.3"/>
    <circle cx="1690" cy="540" r="1.2"/><circle cx="150" cy="790" r="1.4"/><circle cx="440" cy="860" r="1.1"/>
    <circle cx="710" cy="930" r="1.3"/><circle cx="990" cy="760" r="1.2"/><circle cx="1260" cy="890" r="1.4"/>
    <circle cx="1530" cy="810" r="1.1"/><circle cx="1800" cy="920" r="1.3"/>
  </g>
  <!-- Stars - bright -->
  <g fill="#fff" filter="url(#bigGlow)">
    <circle cx="320" cy="190" r="2" opacity="0.9"/>
    <circle cx="780" cy="350" r="2.2" opacity="0.85"/>
    <circle cx="1150" cy="230" r="1.8" opacity="0.9"/>
    <circle cx="1620" cy="420" r="2" opacity="0.85"/>
    <circle cx="500" cy="700" r="2.2" opacity="0.9"/>
    <circle cx="1400" cy="600" r="1.8" opacity="0.85"/>
    <circle cx="960" cy="900" r="2" opacity="0.9"/>
  </g>
  <!-- Moon crescent -->
  <g transform="translate(1600, 180)">
    <circle cx="0" cy="0" r="40" fill="#f0e6c0" opacity="0.15" filter="url(#bigGlow)"/>
    <circle cx="0" cy="0" r="28" fill="#f5ecd0" opacity="0.9"/>
    <circle cx="12" cy="-5" r="24" fill="url(#sky)"/>
  </g>
</svg>
