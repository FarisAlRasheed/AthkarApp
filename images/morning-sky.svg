<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 2400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4da6db"/>
      <stop offset="35%" stop-color="#7ec8e3"/>
      <stop offset="65%" stop-color="#b5dff0"/>
      <stop offset="100%" stop-color="#dceef8"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="18%" r="35%">
      <stop offset="0%" stop-color="#fff8e1" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#ffe082" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#ffcc80" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#7ec8e3" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cloudShadow">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <!-- Sky gradient -->
  <rect width="1920" height="2400" fill="url(#sky)"/>
  <!-- Sun glow -->
  <rect width="1920" height="2400" fill="url(#sunGlow)"/>
  <!-- Sun -->
  <g filter="url(#softGlow)">
    <circle cx="960" cy="320" r="80" fill="#fff5c0" opacity="0.6"/>
    <circle cx="960" cy="320" r="55" fill="#fff8dc" opacity="0.85"/>
    <circle cx="960" cy="320" r="35" fill="#fffef0" opacity="0.95"/>
  </g>
  <!-- Clouds - scattered across the tall canvas -->
  <!-- Cloud 1 - top area -->
  <g opacity="0.55">
    <ellipse cx="300" cy="180" rx="120" ry="40" fill="#fff"/>
    <ellipse cx="350" cy="165" rx="80" ry="35" fill="#fff"/>
    <ellipse cx="260" cy="170" rx="70" ry="30" fill="#fff"/>
    <ellipse cx="320" cy="195" rx="90" ry="25" fill="#f0f4f8" opacity="0.6"/>
  </g>
  <!-- Cloud 2 -->
