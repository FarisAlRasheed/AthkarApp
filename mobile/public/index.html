<!DOCTYPE html>
<html lang="ar">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: the sky runs under the notch; safe-area insets keep content clear of it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>أذكارنا</title>
    <meta name="description" content="أذكار الصباح والمساء والنوم، المسبحة ومواقيت الصلاة" />
    <meta name="theme-color" content="#04050d" />
    <!-- Home-screen app (APP_PLAN: the web build installs like an app on iPhone and Android). -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="أذكارنا" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- The react-native-web recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #04050d;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <script>
      // sw.js is generated by scripts/gen-sw.mjs after `expo export`; it keeps the whole app on the
      // phone so it opens offline. The dev server has none, so registration just fails there.
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }
      // Chrome may offer its install prompt before the app's code has loaded (src/lib/pwa.ts).
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__installPrompt = e;
      });
    </script>
  </head>

  <body>
    <noscript>يحتاج أذكارنا إلى تفعيل JavaScript.</noscript>
    <div id="root"></div>
  </body>
</html>
